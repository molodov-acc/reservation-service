spring:
  application:
    name: reservation-system

  grpc:
    client:
      channels:
        notification-service:
          address: static://localhost:9090
          negotiation-type: plaintext
  datasource:
    # URL подключения: указывает протокол jdbc, СУБД postgresql, хост (localhost), порт (5432) и имя базы данных (my_database)
    url: jdbc:postgresql://localhost:5432/reservation_db
    username: postgres
    password: postgres
    # Явное указание драйвера (для современных версий Spring Boot необязательно, но полезно)
    driver-class-name: org.postgresql.Driver

  jpa:
    # Автоматическое создание/обновление таблиц на основе @Entity классов (в продакшене обычно ставят validate или none)
    hibernate:
      ddl-auto: update
    # Показывать ли SQL-запросы в консоли приложения (полезно для отладки)
    show-sql: true
    properties:
      hibernate:
        # Диалект помогает Hibernate генерировать SQL-запросы, оптимизированные именно под PostgreSQL
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reservation-group
      auto-offset-reset: earliest