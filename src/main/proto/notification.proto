
syntax = "proto3";

package notification.v1;

option java_multiple_files = true;
option java_package = "com.molodov.notification.grpc";
option java_outer_classname = "NotificationProto";

service NotificationService {
  rpc NotifyReservationCancelled (ReservationCancelledRequest)
      returns (NotificationResponse);
}

message ReservationCancelledRequest {
  int64 reservation_id = 1;
  int64 user_id = 2;
  int64 room_id = 3;
}

message NotificationResponse {
  bool accepted = 1;
  string message = 2;
}
